[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Mateus Junior <mateus@matj.dev>"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/falleng0d/computer-use-mcp"
homepage = "https://github.com/falleng0d/computer-use-mcp"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
