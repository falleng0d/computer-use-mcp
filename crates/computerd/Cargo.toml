[package]
name = "computerd"
description = "Daemon inside the computer container that captures the screen and drives input."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
computer-protocol = { version = "0.3.0", path = "../computer-protocol" }
computer-transfer = { version = "0.3.0", path = "../computer-transfer" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"
x11rb = { version = "0.14.0", default-features = false, features = ["shm", "damage", "xtest"] }
